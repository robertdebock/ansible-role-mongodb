---
- name: Verify
  hosts: all
  become: true
  gather_facts: true

  vars:
    mongodb_expected_version: "8.0"

  tasks:
    - name: Check if connection still works
      ansible.builtin.ping:

    - name: Use mongosh
      ansible.builtin.shell: mongosh --eval "db.version()"
      register: mongosh_result
      changed_when: false
      failed_when: "(mongodb_expected_version ~ '.') not in mongosh_result.stdout"
