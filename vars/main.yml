---
# vars file for mongodb

_mongodb_apt_repository:
  Ubuntu: "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-{{ mongodb_version }}.asc ] https://repo.mongodb.org/apt/{{ ansible_facts['distribution'] | lower }} {{ ansible_facts['distribution_release'] }}/mongodb-org/{{ mongodb_version }} multiverse"
  Debian: "deb [ signed-by=/usr/share/keyrings/mongodb-server-{{ mongodb_version }}.asc ] https://repo.mongodb.org/apt/{{ ansible_facts['distribution'] | lower }} {{ ansible_facts['distribution_release'] }}/mongodb-org/{{ mongodb_version }} main"
mongodb_apt_repository: "{{ _mongodb_apt_repository[ansible_facts['distribution']] }}"

_mongodb_default_dbpath:
  default: /var/lib/mongo
  Debian: /var/lib/mongodb
mongodb_default_dbpath: "{{ _mongodb_default_dbpath[ansible_facts['os_family']] | default(_mongodb_default_dbpath['default']) }}"
