---
# tasks file for mongodb

- name: Import assert.yml
  ansible.builtin.import_tasks:
    file: assert.yml
  run_once: true
  delegate_to: localhost

- name: Prepare distribtions that use "apt"
  when:
    - ansible_facts['pkg_mgr'] == "apt"
  block:
    - name: Download the MongoDB signing key
      ansible.builtin.get_url:
        url: "https://pgp.mongodb.com/server-{{ mongodb_version }}.asc"
        dest: /usr/share/keyrings/mongodb-server-{{ mongodb_version }}.asc
        # validate_certs: false
        mode: "0644"

    - name: Install mongodb repository (deb)
      ansible.builtin.apt_repository:
        repo: "{{ mongodb_apt_repository }}"
        update_cache: true
        # validate_certs: false
        filename: mongodb-org-{{ mongodb_version }}.list

- name: Install mongodb repository (rpm)
  ansible.builtin.yum_repository:
    name: mongodb-org-{{ mongodb_version }}
    description: MongoDB Repository
    baseurl: https://repo.mongodb.org/yum/redhat/$releasever/mongodb-org/{{ mongodb_version }}/x86_64/
    gpgcheck: true
    enabled: true
    gpgkey: https://www.mongodb.org/static/pgp/server-{{ mongodb_version }}.asc
  when:
    - ansible_facts['pkg_mgr'] in [ "dnf", "yum", "dnf5" ]

- name: Install mongodb-org
  ansible.builtin.package:
    name: mongodb-org

- name: Configure mongodb
  ansible.builtin.template:
    src: mongod.conf.j2
    dest: /etc/mongod.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart mongod

- name: Start mongod
  ansible.builtin.service:
    name: mongod
    state: started
    enabled: true
